# Reproducible and attested build of the matrix-sdk-crypto Kotlin binding for Otaku (D-238, D-299).
# Public repository, no secret: the only token is the automatic GITHUB_TOKEN, read-only except in
# the release job (contents: write to publish the release, id-token + attestations to attest).
# Two independent builds on two runners must give the same bytes; only then is the archive
# attested and published. Actions pinned by commit (same versions as the Otaku repository).
# No cache on purpose: every build starts from the pinned inputs only (no cache poisoning, nothing
# carried over between runs); the price is ~3 minutes of toolchain setup per build job.
name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build ${{ matrix.attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        attempt: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pins
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source UPSTREAM.env
          for name in UPSTREAM_REPOSITORY UPSTREAM_COMMIT RUST_VERSION RUST_MANIFEST_SHA256 CARGO_NDK_VERSION NDK_VERSION TARGETS; do
            echo "$name=${!name}" >>"$GITHUB_ENV"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false
          fetch-depth: 1

      - name: NDK
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            # The runner image only keeps recent NDKs: install the pinned one (sdkmanager checks
            # the SHA of Google's package) instead of silently using another version.
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          fi
          grep -qx "Pkg.Revision = $NDK_VERSION" "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >>"$GITHUB_ENV"

      - name: Rust toolchain (pinned, no third-party action)
        run: |
          set -euo pipefail
          # Pinned manifest first: rustup checks each component against the manifest it fetches,
          # and check-toolchain.py checks that this manifest is the pinned one (fails early
          # instead of building with a different compiler or standard library).
          manifest="$RUNNER_TEMP/channel-rust-$RUST_VERSION.toml"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$manifest" \
            "https://static.rust-lang.org/dist/channel-rust-$RUST_VERSION.toml"
          echo "$RUST_MANIFEST_SHA256  $manifest" | sha256sum -c -
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update \
            $(for target in $TARGETS; do printf -- '--target %s ' "$target"; done)
          rustup default "$RUST_VERSION"
          python3 -I scripts/check-toolchain.py "$manifest" \
            "${RUSTUP_HOME:-$HOME/.rustup}/toolchains/$RUST_VERSION-x86_64-unknown-linux-gnu" $TARGETS
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          rustc --version && cargo ndk --version

      - name: Build
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.attempt }}
          path: |
            out/
            SHA256SUMS.build
            diag/
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-a
          path: a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-b
          path: b
      - name: Both builds are identical
        run: |
          set -euo pipefail
          # What each build saw must match; then, only when the bytes differ, which ELF sections
          # and crate objects differ. The verdict is the full-file comparison below.
          # Same tools on both runners, or no verdict on the outputs (each build job already
          # checked the Rust manifest; this also covers the NDK and cargo-ndk).
          if ! diff -u a/diag/TOOLCHAIN.txt b/diag/TOOLCHAIN.txt; then
            echo "::error::toolchains differ between the two builds"
            exit 1
          fi
          if ! diff -q a/SHA256SUMS.build b/SHA256SUMS.build >/dev/null; then
            for f in a/diag/sections-*.txt; do
              echo "== $(basename "$f")"
              diff -u "$f" "b/diag/$(basename "$f")" || true
            done
            # Crate objects and build script outputs that differ (the first culprit is the
            # earliest one in the dependency order; link maps are in the artifacts, diag/).
            for f in a/diag/objects-*.txt; do
              echo "== $(basename "$f"): differing objects"
              diff "$f" "b/diag/$(basename "$f")" | grep '^[<>]' | head -200 || true
            done
          fi
          diff -u a/SHA256SUMS.build b/SHA256SUMS.build
          ( cd a/out && sha256sum -c ../SHA256SUMS.build )
          ( cd b/out && sha256sum -c ../SHA256SUMS.build )
          ls -l a/out/jniLibs/*/
          echo "Reproducible: $(wc -l <a/SHA256SUMS.build) identical files"
          echo "Linked crates: $(wc -l <a/out/THIRD_PARTY_CRATES.txt)"

  release:
    needs: compare
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # Sigstore signature of the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-a
          path: .
      - name: Archive
        id: archive
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-otaku\.[0-9]+)?$ ]] || {
            echo "tag $GITHUB_REF_NAME does not match vX.Y.Z[-otaku.N]" >&2
            exit 1
          }
          ( cd out && sha256sum -c --quiet ../SHA256SUMS.build )
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package.sh "$version"
          echo "file=dist/otaku-crypto-android-$version.tar.gz" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.file }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outputs.file }}
        run: |
          set -euo pipefail
          # --verify-tag: never let gh create a tag; the release only exists for a pushed tag.
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" SHA256SUMS.build \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "matrix-sdk-crypto-ffi (commit pinned in UPSTREAM.env) with the patches of this tag. Verify: gh attestation verify <archive> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/build.yml --source-ref refs/tags/$GITHUB_REF_NAME --deny-self-hosted-runners"
